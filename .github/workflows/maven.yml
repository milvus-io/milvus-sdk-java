# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'benchmark/**'
      - 'examples/**'
      - '**/OWNERS'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu:
    name: Build and test on ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: maven
      - name: Update submodule
        run: git submodule update --init
      # Full reactor build: sdk-core, sdk-bulkwriter, and the Testcontainers-backed
      # Docker tests (available on this runner).
      - name: Build with Maven
        run: mvn -Pcoverage --batch-mode --update-snapshots verify
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./sdk-core/target/site/jacoco/jacoco.xml,./sdk-bulkwriter/target/site/jacoco/jacoco.xml
          name: ubuntu-jacoco-coverage
          disable_safe_directory: true
          verbose: true

  windows:
    name: Build and test on windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: maven
      - name: Update submodule
        run: git submodule update --init
      # sdk-core only: the bulkwriter tests write Parquet locally and need Hadoop's
      # native WinUtils (linux-only), and the Testcontainers Docker tests cannot start a
      # Milvus standalone reliably on this runner, so run them only on the ubuntu job.
      - name: Build sdk-core
        run: mvn -pl sdk-core -Pcoverage --batch-mode --update-snapshots "-Dtest=!*DockerTest" verify
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./sdk-core/target/site/jacoco/jacoco.xml
          name: windows-jacoco-coverage
          disable_safe_directory: true
          verbose: true

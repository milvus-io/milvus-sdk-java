name: Java sdk CI test

on:
  workflow_dispatch:
  pull_request:

# Retry transient Maven Central download failures inside Maven (Resolver 1.x reads
# aether.connector.http.retryHandler.* plus aether.connector.{connect,request}Timeout, Resolver
# 2.x reads aether.transport.http.*; each silently ignores the other prefix).
env:
  MAVEN_OPTS: >-
    -Daether.connector.http.retryHandler.count=5
    -Daether.connector.http.retryHandler.interval=1000
    -Daether.connector.http.retryHandler.intervalMax=10000
    -Daether.connector.http.retryHandler.serviceUnavailable=500,502,503,504,429
    -Daether.connector.connectTimeout=30000
    -Daether.connector.requestTimeout=120000
    -Daether.transport.http.retryHandler.count=5
    -Daether.transport.http.retryHandler.interval=1000
    -Daether.transport.http.retryHandler.intervalMax=10000
    -Daether.transport.http.retryHandler.serviceUnavailable=500,502,503,504,429
    -Daether.transport.http.connectTimeout=30000
    -Daether.transport.http.requestTimeout=120000

jobs:
  build:
    name: Deploy milvus server,build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Deploy Milvus
        timeout-minutes: 15
        shell: bash
        working-directory: tests/milvustestv2/src/test/java/resources
        run: |
          echo "deploy milvus"
          ls
          sudo docker compose up -d

      # nick-fields/retry only supports exit-code-based retry, so a genuinely broken commit
      # re-runs on ANY failure. Keep max_attempts small to bound the worst-case wall time
      # (2 x 30 min): two attempts still cover a single transient download failure.
      - name: Build jar
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_on: error
          command: |
            set -euo pipefail
            echo "build jar"
            git submodule update --init
            mvn clean versions:set -DnewVersion=2.6.0
            mvn clean install -Dmaven.test.skip=true


name: Publish release to Maven Central

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# Maven Central releases are immutable. Do not publish two release tags at the same time,
# and do not cancel a deployment after it has started uploading artifacts.
concurrency:
  group: maven-central-publish
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Maven artifacts
    if: github.repository == 'milvus-io/milvus-sdk-java'
    runs-on: ubuntu-latest
    environment: maven-central
    timeout-minutes: 75

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8.0.462'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # GitHub ubuntu runners now default to Maven 3.10.0, which writes maven-metadata-local.xml
      # into the file:// staging repository. central-publishing-maven-plugin (as configured) only
      # deletes maven-metadata-central-staging.xml, so the stray file ends up in the bundle and
      # Sonatype Central rejects the deployment ("Bundle has content that does NOT have a .pom
      # file"). Pin Maven 3.9.x until the plugin handles maven-metadata-local.xml.
      # See https://github.com/mavenplugins/central-publishing-maven-plugin/issues/79
      - name: Set up Maven 3.9.x
        shell: bash
        run: |
          set -euo pipefail
          MVN_VERSION="3.9.16"
          curl -fsSL -o "${RUNNER_TEMP}/apache-maven.tar.gz" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MVN_VERSION}/apache-maven-${MVN_VERSION}-bin.tar.gz"
          tar -xzf "${RUNNER_TEMP}/apache-maven.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MVN_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Validate release tag and project version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag. Expected vX.Y.Z."
            exit 1
          fi

          tag_version="${tag#v}"
          project_version="$(mvn --batch-mode --no-transfer-progress help:evaluate \
            -Dexpression=revision -DforceStdout -q)"

          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Release tag version $tag_version does not match POM revision $project_version."
            exit 1
          fi

          ./scripts/extract_changelog.sh "${tag_version}" > /dev/null

          echo "Publishing milvus-sdk-java $project_version from tag $tag."

      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Prelease
          -Dmaven.test.skip=true
          clean deploy

      # The Spring Boot starter requires Java 17, so the Java 8 deploy above does not include it (its
      # module is only in the reactor on JDK 17+). Publish it separately; it resolves milvus-sdk-java
      # from the local repository, where the deploy above installed it.
      - name: Set up Java 17 for the Spring Boot starter
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish Spring Boot starter to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Prelease
          -Dmaven.test.skip=true
          -pl sdk-spring-boot-starter
          clean deploy

  release:
    name: Create GitHub release
    needs: publish
    if: needs.publish.result == 'success' && github.repository == 'milvus-io/milvus-sdk-java'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Prepare release metadata
        id: release-info
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          release_date="$(date -u +%F)"
          milvus_minor="$(echo "$version" | cut -d. -f1,2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "milvus_minor=${milvus_minor}" >> "$GITHUB_OUTPUT"

          changelog="$(./scripts/extract_changelog.sh "${version}")"
          body_file="${RUNNER_TEMP}/release_body.md"
          {
            echo "Release date: ${release_date}"
            echo "Compatible with Milvus v${milvus_minor}.x"
            echo
            printf '%s\n' "${changelog}"
          } > "${body_file}"
          echo "body_path=${body_file}" >> "${GITHUB_OUTPUT}"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: milvus-sdk-java-${{ steps.release-info.outputs.version }}
          bodyFile: ${{ steps.release-info.outputs.body_path }}
          draft: false
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

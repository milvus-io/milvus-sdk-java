# Automatically backport every PR merged into master to the 3.0 branch, and keep the
# backport queue clean by closing redundant backport PRs whose content is already on 3.0.
#
# Backport (pull_request_target.closed on merged master PRs): the merge commit is
# cherry-picked onto a throwaway branch off 3.0 and a `[cherry-pick]` PR into 3.0 is
# opened. Mergify then auto-merges that PR once its CI checks pass (see .github/mergify.yml).
# Exclude a PR from backporting by adding the `skip-cherry-pick` label before merging.
#
# Sweep (push to 3.0 / schedule): when a manual cherry-pick delivers a master change to
# 3.0, an auto-backport PR for the same change may still be open waiting on CI; Mergify
# would squash-merge it as an empty commit. The sweep detects (git cherry patch-id match)
# that the PR's content is already on 3.0 and closes the PR and deletes its branch.
# Only PRs carrying the `backport-3.0` label are considered; manual `cherry-pick.yml` PRs
# are left untouched for manual review.
#
# Conflicts cannot be resolved in automation: the run fails loudly and the changes must be
# backported by hand. Benign cases (commit already present on 3.0, or a cherry-pick that
# produces an empty change) are skipped quietly.
#
# Branch pushes, PR creation/closing, and branch deletion authenticate with the repository
# secret `CHERRY_PICK_PAT` (a personal access token with `repo` scope, or fine-grained
# `contents: write` + `pull-requests: write` scoped to this repository).

name: Backport to 3.0

on:
  # pull_request_target runs in the base-repo context (repository secrets available) and uses
  # the workflow definition from the base branch. That is required so merged PRs that came from
  # forks can still be backported with CHERRY_PICK_PAT. It is safe here because the workflow only
  # checks out the fixed `3.0` ref and acts on the merge_commit_sha from the event payload; it
  # never checks out or executes the PR head.
  pull_request_target:
    types: [closed]
  # run the sweep whenever 3.0 moves (e.g. a manual cherry-pick landed) and as a periodic
  # safety net for pushes that race Mergify's auto-merge.
  # Note: a `push` trigger executes the workflow file as it exists on the pushed branch, so
  # the sweep-under-push only becomes effective once this updated file is itself backported
  # onto 3.0; until then the scheduled run (default-branch version) covers it.
  push:
    branches:
      - '3.0'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Least privilege: pushes, PR creation/closing and branch deletion use the PAT
# (CHERRY_PICK_PAT); the GITHUB_TOKEN is only used by actions/checkout and local git ops,
# so read is enough.
permissions:
  contents: read

# Backport runs are keyed per merge commit so re-dispatch/rerun cannot race on the shared
# remote branch. Sweep runs (push/schedule, no merge commit) all share the empty group and
# cancel each other, which is fine because a sweep is idempotent and fast.
concurrency:
  group: backport-3.0-${{ github.event.pull_request.merge_commit_sha }}
  cancel-in-progress: true

jobs:
  backport:
    name: Backport to 3.0
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-cherry-pick')
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          # quote the branch name: unquoted YAML 3.0 parses as a float and checkout
          # receives "3" instead of the "3.0" branch
          ref: '3.0'
          fetch-depth: 0
          # do not persist the GITHUB_TOKEN extraheader into .git/config: it would take
          # precedence over the PAT in the push URL and cause a 403 (contents: read)
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate merge commit
        id: validate
        env:
          COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ -z "$COMMIT" ]; then
            echo "::error::merge_commit_sha is empty"
            exit 1
          fi
          git fetch origin master
          if ! git rev-parse --verify --quiet "$COMMIT^{commit}" >/dev/null; then
            echo "::error::merge commit '$COMMIT' does not exist"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" origin/master; then
            echo "::error::merge commit '$COMMIT' is not on 'master'"
            exit 1
          fi
          if git merge-base --is-ancestor "$COMMIT" HEAD; then
            echo "::notice::merge commit '$COMMIT' is already on '3.0'; nothing to backport"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FULL_SHA=$(git rev-parse "$COMMIT")
          # use git's --grep filter and capture the output: a `grep -q` early-exit would be
          # killed by SIGPIPE under pipefail and misreport a match as failure.
          if [ -n "$(git log HEAD --format=%B --grep="cherry picked from commit ${FULL_SHA}")" ]; then
            echo "::notice::merge commit '$COMMIT' was already cherry-picked onto '3.0'; nothing to backport"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Create cherry-pick branch
        id: branch
        if: steps.validate.outputs.skip != 'true'
        env:
          COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          SHORT_SHA=$(git rev-parse --short "$COMMIT")
          # unique per run AND attempt (GITHUB_RUN_ID): the plain name would be predictable,
          # and a retried run keeps the same RUN_ID, so include RUN_ATTEMPT to avoid a
          # non-fast-forward push when a previous attempt already pushed this branch.
          BRANCH="cherry-pick-${SHORT_SHA}-to-3.0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Cherry-pick the merge commit
        id: cherrypick
        if: steps.validate.outputs.skip != 'true'
        env:
          COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          PARENT_COUNT=$(git rev-list --parents -n 1 "$COMMIT" | awk '{print NF}')
          if [ "$PARENT_COUNT" -gt 2 ]; then
            echo "::warning::merge commit '$COMMIT' has multiple parents; cherry-picking with -m 1 (diff against first parent)"
            CHERRY_PICK_ARGS="-x -m 1"
          else
            CHERRY_PICK_ARGS="-x"
          fi
          if ! git cherry-pick ${CHERRY_PICK_ARGS} "$COMMIT" 2>/tmp/cherry_pick_err; then
            # capture instead of `git ls-files -u | grep -q .` to avoid SIGPIPE/pipefail
            # misreporting once the conflict list exceeds the pipe buffer.
            if [ -n "$(git ls-files -u)" ]; then
              echo "::error::cherry-pick of '$COMMIT' has conflicts; a manual backport to 3.0 is required"
            elif git diff --quiet; then
              echo "::notice::merge commit '$COMMIT' appears to already be applied on '3.0' (cherry-pick produced an empty change); nothing to backport"
              # leave the working tree clean before skipping the rest of the job
              git cherry-pick --abort 2>/dev/null || true
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "::error::cherry-pick of '$COMMIT' failed (neither a conflict nor an empty change)"
            fi
            cat /tmp/cherry_pick_err
            git cherry-pick --abort 2>/dev/null || true
            exit 1
          fi

      - name: Check for duplicate content on 3.0
        id: dupcheck
        if: steps.validate.outputs.skip != 'true' && steps.cherrypick.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git fetch origin 3.0
          # git cherry compares patch-ids, so an equivalent change already on 3.0 (e.g. a
          # manual cherry-pick merged after this run started) makes every commit of the
          # branch show as '-' and there is nothing new to backport. Skip instead of opening
          # a duplicate PR that Mergify would merge as an empty commit.
          # Capture the full output instead of `grep -q`: grep -q exits at the first match
          # and would SIGPIPE git cherry under `set -o pipefail`, misreporting the pipeline
          # as failed and silently skipping a backport that is still needed.
          if [ -n "$(git cherry -v origin/3.0 HEAD | grep '^+')" ]; then
            echo "::notice::there are changes not yet on '3.0'; proceeding with the backport"
          else
            echo "::notice::the cherry-picked changes are already on '3.0'; nothing to backport"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign off for DCO
        if: steps.validate.outputs.skip != 'true' && steps.cherrypick.outputs.skip != 'true' && steps.dupcheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # If the source commit already carries the author's own DCO attestation,
          # pass it through unchanged: the cherry-pick preserves the author, so the
          # sign-off still matches and the workflow adds nothing.
          AUTHOR_SIGN_OFF="Signed-off-by: $(git show -s --format='%an <%ae>' HEAD)"
          if git log -1 --format='%B' | grep -Fq "$AUTHOR_SIGN_OFF"; then
            exit 0
          fi
          # Otherwise the source commit was never DCO-signed. The cherry-picked commit
          # is a NEW commit created by this workflow, so signing it as the original
          # author would be an attestation they never made. Instead the operator
          # (github.actor, who merged the source PR) attests DCO for this commit,
          # and the git committer identity is aligned to the sign-off so DCO's
          # author-or-committer rule matches.
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git log -1 --format='%B' > /tmp/msg
          printf '\nSigned-off-by: %s <%s@users.noreply.github.com>\n' "$GITHUB_ACTOR" "$GITHUB_ACTOR" >> /tmp/msg
          git commit --amend -F /tmp/msg

      - name: Push branch
        if: steps.validate.outputs.skip != 'true' && steps.cherrypick.outputs.skip != 'true' && steps.dupcheck.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          PUSH_TOKEN: ${{ secrets.CHERRY_PICK_PAT }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::secrets.CHERRY_PICK_PAT is not configured; add a PAT with 'repo' scope (contents + PR write) and store it as CHERRY_PICK_PAT"
            exit 1
          fi
          # push with the tokenized URL inline so the PAT is never written into .git/config
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

      - name: Create pull request
        if: steps.validate.outputs.skip != 'true' && steps.cherrypick.outputs.skip != 'true' && steps.dupcheck.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.CHERRY_PICK_PAT }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          SHORT_SHA: ${{ steps.branch.outputs.short_sha }}
          COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secrets.CHERRY_PICK_PAT is not configured; add a PAT with 'repo' scope (contents + PR write) and store it as CHERRY_PICK_PAT"
            exit 1
          fi
          COMMIT_TITLE=$(git show -s --format=%s "$COMMIT")
          COMMIT_BODY=$(git show -s --format=%b "$COMMIT")
          TITLE="[cherry-pick] ${COMMIT_TITLE}"
          BODY_FILE=$(mktemp)
          printf 'Cherry-picks commit `%s` (%s) from `master` to `3.0`.\n\n' "$COMMIT" "$SHORT_SHA" > "$BODY_FILE"
          printf 'Created automatically by the backport workflow after the PR was merged to master.\n' >> "$BODY_FILE"
          if [ -n "$COMMIT_BODY" ]; then
            printf '\n%s\n' "$COMMIT_BODY" >> "$BODY_FILE"
          fi
          # Re-running the backport while a previous PR is still open must not create a
          # duplicate: match an existing open PR whose body references this exact source
          # commit SHA AND the marker unique to this workflow, so a PR opened by the manual
          # cherry-pick.yml for the same commit is never labeled or auto-merged. gh's --jq
          # does not forward jq flags, so read the SHA from the environment instead of --arg.
          # awk reads all input (no early-exit pipe); gh pr list pages internally, and the
          # generous --limit window is ample because the auto-merge + branch deletion keep
          # the 3.0 backport queue short.
          FULL_SHA=$(git rev-parse "$COMMIT")
          export FULL_SHA
          EXISTING_URL=$(gh pr list --state open --base 3.0 --limit 500 --json url,body \
            --jq '.[] | select((.body // "") | (contains(env.FULL_SHA) and contains("Created automatically by the backport workflow"))) | .url' \
            | awk 'NR == 1 { print }')
          # The backport-3.0 label is the trusted-provenance signal for the Mergify auto-merge
          # rule: it can only be added with the CHERRY_PICK_PAT (a trusted member's token), so a
          # fork spoofing the cherry-pick branch/title pattern cannot get its PR auto-merged.
          # Ensure the label exists first (idempotent), then apply it to whatever PR is used so
          # a re-run after a labeling failure restores the auto-merge invariant.
          gh label create backport-3.0 --force >/dev/null 2>&1 || true
          if [ -n "$EXISTING_URL" ]; then
            echo "An open cherry-pick PR already exists: $EXISTING_URL"
            if ! gh pr edit "$EXISTING_URL" --add-label backport-3.0; then
              echo "::error::Failed to add 'backport-3.0' label to $EXISTING_URL"
              exit 1
            fi
          else
            PR_URL=$(gh pr create --base 3.0 --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE" 2>/tmp/pr_err)
            if [ -z "$PR_URL" ]; then
              echo "::error::Failed to create pull request"
              cat /tmp/pr_err
              exit 1
            fi
            # A PR created without the backport-3.0 label would never auto-merge, so fail
            # loudly if the label cannot be added instead of leaving it silent.
            if ! gh pr edit "$PR_URL" --add-label backport-3.0; then
              echo "::error::Failed to add 'backport-3.0' label to $PR_URL"
              exit 1
            fi
            echo "Pull request created: $PR_URL"
          fi

  sweep:
    name: Close redundant backports
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target'
    steps:
      - name: Checkout 3.0
        uses: actions/checkout@v4
        with:
          ref: '3.0'
          fetch-depth: 0
          persist-credentials: false

      - name: Sweep open backport PRs
        env:
          GH_TOKEN: ${{ secrets.CHERRY_PICK_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secrets.CHERRY_PICK_PAT is not configured; add a PAT with 'repo' scope and store it as CHERRY_PICK_PAT"
            exit 1
          fi

          # Capture the listing and check its exit status: `mapfile < <(...)` swallows the
          # command's exit code, so a broken PAT / rate limit would otherwise look like "no
          # open PRs" and report success while doing nothing. Exclude PRs carrying the
          # do-not-merge escape hatch (documented in .github/mergify.yml) so a maintainer
          # pausing a backport for review is never force-closed by this sweep.
          PR_LIST=$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --base 3.0 --state open --label backport-3.0 --limit 100 \
            --json number,headRefName,labels \
            --jq '.[] | select(all(.labels[]?; .name != "do-not-merge")) | [.number, .headRefName] | @tsv') || {
            echo "::error::gh pr list failed (check CHERRY_PICK_PAT / rate limit)"
            exit 1
          }
          # An empty listing is the steady state; guard on the string, because
          # `mapfile -t <<< ""` still produces one empty element (a here-string always
          # appends a trailing newline), which would otherwise spin the loop once with an
          # empty NUM/HEAD_REF and log misleading "checking PR #" lines.
          if [ -z "$PR_LIST" ]; then
            echo "No open backport PRs to check."
            exit 0
          fi
          mapfile -t PRS <<< "$PR_LIST"

          git fetch origin 3.0
          closed=0
          for row in "${PRS[@]}"; do
            NUM=$(printf '%s' "$row" | cut -f1)
            HEAD_REF=$(printf '%s' "$row" | cut -f2)
            echo "Checking PR #${NUM} (${HEAD_REF})"
            if ! git fetch origin "$HEAD_REF" >/dev/null 2>&1; then
              echo "skip: cannot fetch ${HEAD_REF}"
              continue
            fi
            # '+' lines mean changes not yet on 3.0; if there are none, the backport is
            # redundant. Capture the full output instead of `grep -q`: grep -q exits at the
            # first match and would SIGPIPE git cherry under `set -o pipefail`, misreporting
            # a '+' match as a failure and wrongly closing a still-needed PR.
            if [ -z "$(git cherry -v origin/3.0 FETCH_HEAD | grep '^+')" ]; then
              echo "::notice::PR #${NUM} changes are already on 3.0; closing and deleting ${HEAD_REF}"
              if gh pr close "$NUM" --repo "${GITHUB_REPOSITORY}" \
                  --comment "This backport is already present on 3.0 (delivered by another cherry-pick). Closing and deleting its branch."; then
                closed=$((closed+1))
              else
                echo "::warning::failed to close PR #${NUM}"
                continue
              fi
              # Only delete the branch when it matches the throwaway pattern this workflow
              # creates. The backport-3.0 label is manually assignable and the same branch
              # can back a second open PR, so a bare push --delete could remove a branch the
              # author did not intend to be deleted; the close itself is unaffected.
              case "$HEAD_REF" in
                cherry-pick-*to-3.0-*)
                  # push with the tokenized URL inline so the PAT is never written into .git/config
                  git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "$HEAD_REF" \
                    || echo "::warning::failed to delete branch ${HEAD_REF}"
                  ;;
                *)
                  echo "::warning::PR #${NUM} head branch ${HEAD_REF} is not a cherry-pick throwaway branch; leaving it in place"
                  ;;
              esac
            else
              echo "PR #${NUM} still has changes not on 3.0; keeping it open"
            fi
          done
          echo "Closed ${closed} redundant backport PR(s)."
